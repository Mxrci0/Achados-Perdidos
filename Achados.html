<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Achados e Perdidos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f1efe8;
    --surface-0: #f7f6f2;
    --text-primary: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #e3e1d9;
    --radius: 8px;
    --bg-success: #eaf3de;
    --text-success: #27500a;
    --bg-warning: #faeeda;
    --text-warning: #633806;
    --fill-primary: #1a1a1a;
    --on-primary: #ffffff;
    --text-danger: #a32d2d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  body {
    background: var(--surface-0);
    color: var(--text-primary);
    margin: 0;
    padding: 24px;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
  }

  h2 { font-weight: 500; margin: 0; }

  button, input, select, textarea {
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    height: 36px;
    padding: 0 12px;
    background: var(--surface-2);
    color: var(--text-primary);
  }
  textarea { height: auto; padding: 8px 12px; resize: vertical; }

  button {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button:hover { background: var(--surface-1); }
  button.primary { background: var(--fill-primary); color: var(--on-primary); border: none; }
  button.primary:hover { opacity: 0.9; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 1.25rem;
  }
  .stat-card {
    background: var(--surface-1);
    border-radius: var(--radius);
    padding: 1rem;
  }
  .stat-card p:first-child {
    margin: 0 0 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stat-card p:last-child {
    margin: 0;
    font-size: 24px;
    font-weight: 500;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .filters input[type="text"] { flex: 2; min-width: 180px; }
  .filters select { flex: 1; min-width: 130px; }
  .filters input[type="date"] { flex: 1; min-width: 140px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .card-top i { font-size: 20px; color: var(--text-secondary); }

  .badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: var(--radius);
  }
  .badge.disponivel { background: var(--bg-success); color: var(--text-success); }
  .badge.reivindicado { background: var(--bg-warning); color: var(--text-warning); }
  .badge.devolvido { background: var(--surface-1); color: var(--text-secondary); }

  .card p { margin: 0 0 2px; }
  .card .title { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .card .local { font-size: 13px; color: var(--text-secondary); }
  .card .data { font-size: 12px; color: var(--text-muted); margin: 0; }

  .empty {
    color: var(--text-secondary);
    font-size: 14px;
    padding: 2rem 0;
    text-align: center;
    grid-column: 1 / -1;
  }

  .form-panel {
    display: none;
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .form-panel.open { display: block; }
  .form-panel h3 { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .form-row > * { flex: 1; min-width: 160px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .error-text { color: var(--text-danger); font-size: 13px; margin: -4px 0 8px; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div>
      <h2>Achados e perdidos</h2>
      <p style="margin:4px 0 0; font-size:13px; color:var(--text-secondary);">Campus Central</p>
    </div>
    <button class="primary" id="toggle-form-btn">
      <i class="ti ti-plus"></i> Cadastrar item
    </button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <p>Itens ativos</p>
      <p id="stat-ativos">0</p>
    </div>
    <div class="stat-card">
      <p>Devolvidos</p>
      <p id="stat-devolvidos">0</p>
    </div>
    <div class="stat-card">
      <p>Aguardando retirada</p>
      <p id="stat-aguardando">0</p>
    </div>
  </div>

  <div class="form-panel" id="form-panel">
    <h3>Cadastrar item encontrado</h3>
    <div class="form-row">
      <input type="text" id="f-title" placeholder="Título do item" />
      <select id="f-category">
        <option value="">Categoria</option>
        <option>Eletrônicos</option>
        <option>Documentos</option>
        <option>Vestuário</option>
        <option>Acessórios</option>
        <option>Outros</option>
      </select>
    </div>
    <div class="form-row">
      <input type="text" id="f-local" placeholder="Local onde foi encontrado" />
      <input type="date" id="f-data" />
    </div>
    <div class="form-row">
      <textarea id="f-obs" placeholder="Observações" rows="2" style="width:100%;"></textarea>
    </div>
    <p class="error-text" id="form-error" style="display:none;"></p>
    <div class="form-actions">
      <button id="cancel-form-btn">Cancelar</button>
      <button class="primary" id="submit-form-btn">Salvar item</button>
    </div>
  </div>

  <div class="filters">
    <input type="text" id="filter-keyword" placeholder="Buscar por palavra-chave" />
    <select id="filter-category">
      <option value="">Categoria</option>
      <option>Eletrônicos</option>
      <option>Documentos</option>
      <option>Vestuário</option>
      <option>Acessórios</option>
      <option>Outros</option>
    </select>
    <input type="date" id="filter-date" />
  </div>

  <div class="grid" id="items-grid"></div>

</div>

<script>
  const iconByCategory = {
    "Eletrônicos": "ti-device-mobile",
    "Documentos": "ti-file-text",
    "Vestuário": "ti-shirt",
    "Acessórios": "ti-wallet",
    "Outros": "ti-box"
  };

  const badgeClass = {
    "Disponível": "disponivel",
    "Reivindicado": "reivindicado",
    "Devolvido": "devolvido"
  };

  let items = [
    { title: "Celular preto", category: "Eletrônicos", local: "Biblioteca central", date: "2026-09-22", status: "Disponível" },
    { title: "Carteira de couro", category: "Acessórios", local: "Refeitório", date: "2026-09-21", status: "Reivindicado" },
    { title: "RG e carteirinha", category: "Documentos", local: "Bloco B, sala 12", date: "2026-09-20", status: "Disponível" },
    { title: "Guarda-chuva azul", category: "Outros", local: "Portaria principal", date: "2026-09-18", status: "Devolvido" }
  ];

  function formatDate(iso) {
    const [y, m, d] = iso.split("-");
    const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    return `${d} ${meses[parseInt(m,10)-1]} ${y}`;
  }

  function updateStats(list) {
    document.getElementById("stat-ativos").textContent = list.filter(i => i.status === "Disponível").length;
    document.getElementById("stat-devolvidos").textContent = list.filter(i => i.status === "Devolvido").length;
    document.getElementById("stat-aguardando").textContent = list.filter(i => i.status === "Reivindicado").length;
  }

  function render() {
    const keyword = document.getElementById("filter-keyword").value.trim().toLowerCase();
    const category = document.getElementById("filter-category").value;
    const date = document.getElementById("filter-date").value;

    const filtered = items.filter(item => {
      const matchesKeyword = !keyword || item.title.toLowerCase().includes(keyword) || item.local.toLowerCase().includes(keyword);
      const matchesCategory = !category || item.category === category;
      const matchesDate = !date || item.date === date;
      return matchesKeyword && matchesCategory && matchesDate;
    });

    const grid = document.getElementById("items-grid");
    grid.innerHTML = "";

    if (filtered.length === 0) {
      grid.innerHTML = '<p class="empty">Nenhum item encontrado com esses filtros.</p>';
    } else {
      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <i class="ti ${iconByCategory[item.category] || 'ti-box'}"></i>
            <span class="badge ${badgeClass[item.status]}">${item.status}</span>
          </div>
          <p class="title">${item.title}</p>
          <p class="local">${item.local}</p>
          <p class="data">${formatDate(item.date)}</p>
        `;
        grid.appendChild(card);
      });
    }

    updateStats(items);
  }

  document.getElementById("filter-keyword").addEventListener("input", render);
  document.getElementById("filter-category").addEventListener("change", render);
  document.getElementById("filter-date").addEventListener("change", render);

  const formPanel = document.getElementById("form-panel");
  const formError = document.getElementById("form-error");

  document.getElementById("toggle-form-btn").addEventListener("click", () => {
    formPanel.classList.toggle("open");
  });

  document.getElementById("cancel-form-btn").addEventListener("click", () => {
    formPanel.classList.remove("open");
    formError.style.display = "none";
  });

  document.getElementById("submit-form-btn").addEventListener("click", () => {
    const title = document.getElementById("f-title").value.trim();
    const category = document.getElementById("f-category").value;
    const local = document.getElementById("f-local").value.trim();
    const date = document.getElementById("f-data").value;

    if (!title || !category || !local || !date) {
      formError.textContent = "Preencha título, categoria, local e data antes de salvar.";
      formError.style.display = "block";
      return;
    }

    items.unshift({ title, category, local, date, status: "Disponível" });

    document.getElementById("f-title").value = "";
    document.getElementById("f-category").value = "";
    document.getElementById("f-local").value = "";
    document.getElementById("f-data").value = "";
    document.getElementById("f-obs").value = "";
    formError.style.display = "none";
    formPanel.classList.remove("open");

    render();
  });

  render();
</script>
</body>
</html>
